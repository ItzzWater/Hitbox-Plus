name: Feature request
description: Suggest an idea for Hitbox+
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Hitbox+ to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: When would you use it? PvP, UHC, building, something else?
