name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.21.11"
            java: "21"
          - version: "26.1"
            java: "25"
          - version: "26.2"
            java: "25"
          - version: "26.3"
            java: "25"
    defaults:
      run:
        working-directory: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hitboxesplus-${{ matrix.version }}
          path: ${{ matrix.version }}/build/libs/*.jar
